<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>トーク一覧</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background-color: #ffffff;
        }

        .header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            position: sticky;
            top: 0;
        }

        /* 部屋作成フォーム */
        .create-area {
            padding: 15px;
            border-bottom: 1px solid #eee;
            background-color: #f8f9fa;
        }

            .create-area input {
                padding: 8px;
                border: 1px solid #ddd;
                border-radius: 4px;
                width: 60%;
            }

            .create-area button {
                padding: 8px 15px;
                background-color: #85E249;
                border: none;
                border-radius: 4px;
                color: white;
                font-weight: bold;
                cursor: pointer;
            }

        /* ルームリスト */
        .room-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            text-decoration: none;
            color: black;
        }

            .room-item:active {
                background-color: #f5f5f5;
            }

        .room-icon {
            width: 50px;
            height: 50px;
            background-color: #abc;
            border-radius: 18px;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }

        .room-info {
            flex: 1;
        }

        .room-name {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .room-msg {
            font-size: 13px;
            color: #888;
        }

        .logout-btn {
            display: block;
            text-align: center;
            padding: 20px;
            color: #e74c3c;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">トーク</div>

    <div class="create-area">
        <form action="/create_room" method="POST">
            <input type="text" name="room_name" placeholder="新しい部屋の名前" required>
            <button type="submit">作成</button>
        </form>
    </div>

    <div class="room-list">
        {% for room in rooms %}
        <a href="/chat/{{ room.name }}" class="room-item">
            <div class="room-icon">{{ room.name[0] }}</div>
            <div class="room-info">
                <div class="room-name">{{ room.name }}</div>
                <div class="room-msg">タップしてトークを開始</div>
            </div>
        </a>
        {% endfor %}
    </div>

    <a href="/logout" class="logout-btn">ログアウト</a>

</body>
</html>
