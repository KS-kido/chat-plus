<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chat - {{ room_name }}</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        :root {
            --line-blue: #7494C0;
            --line-green: #85E249;
            --header-dark: #35495e;
            --bg-gray: #f8f8f8;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* 全体のスクロールを禁止し、メッセージエリアだけを動かす */
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Kaku Gothic ProN", sans-serif;
        }

        /* アプリ全体のレイアウト */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100dvh; /* 動的ビューポート：スマホのキーボード表示に対応 */
            background-color: var(--line-blue);
        }

        /* ヘッダーデザイン */
        .header {
            background: var(--header-dark);
            color: white;
            padding: env(safe-area-inset-top) 15px 10px 15px;
            display: flex;
            align-items: center;
            min-height: 50px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 100;
        }

        .back-btn {
            text-decoration: none;
            color: white;
            font-size: 20px;
            margin-right: 15px;
        }

        /* メッセージ表示エリア */
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            -webkit-overflow-scrolling: touch;
        }

        /* 吹き出しの共通設定 */
        .msg-box {
            margin-bottom: 12px;
            max-width: 85%; /* 【調整】タイムスタンプが入るスペース確保のため少し広げました */
            display: flex;
            flex-direction: column;
        }

        /* 【重要】吹き出しとタイムスタンプを横並びにするためのコンテナ */
        .msg-row {
            display: flex;
            align-items: flex-end; /* 下揃えにすることで、LINEのように時間の文字が吹き出しの底辺に並びます */
        }

        .text {
            padding: 10px 14px;
            font-size: 16px;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
        }

            /* 吹き出しの中の位置情報リンクを見やすく装飾 */
            .text a {
                color: #0055aa;
                text-decoration: underline;
                font-weight: bold;
            }

        /* 【追加】タイムスタンプの文字デザイン */
        .timestamp {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.8); /* 背景の青に馴染む白っぽい色 */
            margin: 0 5px; /* 吹き出しとの隙間 */
            white-space: nowrap; /* 途中で改行されるのを防ぐ */
        }

        /* 相手のメッセージ（左側） */
        .other-msg {
            align-self: flex-start;
        }

            /* 【追加】相手の時は、[吹き出し] [時間] の順番に並べる */
            .other-msg .msg-row {
                flex-direction: row;
            }

            /* 相手の時間の文字色は、白背景で見えやすいように少し暗めのグレーに */
            .other-msg .timestamp {
                color: #666666;
            }

            .other-msg .text {
                background: white;
                border-radius: 18px 18px 18px 4px;
            }

            .other-msg .username {
                font-size: 11px;
                color: white;
                margin-bottom: 3px;
                margin-left: 5px;
            }

        /* 自分のメッセージ（右側） */
        .my-msg {
            align-self: flex-end;
        }

            /* 【追加】自分の時は、[時間] [吹き出し] のリバース（逆転）順に並べる */
            .my-msg .msg-row {
                flex-direction: row-reverse;
            }

            .my-msg .text {
                background: var(--line-green);
                border-radius: 18px 18px 4px 18px;
            }

            .my-msg .username {
                display: none; /* 自分の名前は表示しない */
            }

        /* 入力エリア */
        .input-area {
            background: white;
            padding: 10px 10px calc(10px + env(safe-area-inset-bottom)) 10px;
            display: flex;
            align-items: center;
            border-top: 1px solid #ddd;
        }

        .geo-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 0 10px 0 5px;
            outline: none;
            transition: transform 0.1s;
        }

            .geo-btn:active {
                transform: scale(0.85);
            }

        #input_msg {
            flex: 1;
            border: 1px solid #eee;
            background: #f0f0f0;
            padding: 10px 15px;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
        }

        .send-btn {
            color: #007aff;
            font-weight: bold;
            padding: 0 15px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 16px;
        }

        .delete-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 0 5px;
            opacity: 0.5;
            outline: none;
        }

            .delete-btn:hover {
                opacity: 1;
            }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <a href="/list" class="back-btn">＜</a>
            <span><b>{{ room_name }}</b></span>
        </div>

        <div id="messages">
            {% for msg in history %}
            <div id="msg-{{ msg.id }}" class="msg-box {{ 'my-msg' if msg.login_id == session['login_id'] else 'other-msg' }}">
                <span class="username">{{ msg.user.display_name }}</span>

                <div class="msg-row">
                    {% if msg.login_id == session['login_id'] %}
                    <button class="delete-btn" onclick="deleteMessage('{{ msg.id }}')">🗑️</button>
                    {% endif %}

                    <div class="text">
                        {% if msg.content.startswith('https://www.google.com/maps?q=') %}
                        <a href="{{ msg.content }}" target="_blank">📍 現在地を共有しました</a>
                        {% else %}
                        {{ msg.content }}
                        {% endif %}
                    </div>
                    <span class="timestamp">{{ msg.created_at.strftime('%H:%M') }}</span>
                </div>
            </div>
            {% endfor %}
        </div>

        <div class="input-area">
            <button class="geo-btn" onclick="sendLocation()">📍</button>
            <input type="text" id="input_msg" placeholder="メッセージ" autocomplete="off">
            <button class="send-btn" onclick="send()">送信</button>
        </div>
    </div>

    <script>
    const socket = io();
    const currentRoom = "{{ room_name }}";
    const myLoginId = "{{ session['login_id'] }}";

    socket.on('connect', () => {
        socket.emit('join', { room: currentRoom });
    });

    // サーバーから新しいメッセージが届いた時の処理
    socket.on('message_from_server', function (data) {
        const msgDiv = document.getElementById('messages');

        const isMyMsg = (data.login_id === myLoginId);
        const msgClass = isMyMsg ? 'my-msg' : 'other-msg';

        let displayContent = data.msg;

        if (data.msg.startsWith('https://www.google.com/maps?q=')) {
            displayContent = `<a href="${data.msg}" target="_blank" class="map-link">📍 現在地を共有しました</a>`;
        }

        // 🆕 リアルタイムに届いた自分のメッセージにもゴミ箱ボタンを表示できるように調整
        // また、後から消せるように id="msg-${data.id}" 属性を付与します
        let deleteBtnHtml = '';
        if (isMyMsg && data.id) {
            deleteBtnHtml = `<button class="delete-btn" onclick="deleteMessage('${data.id}')">🗑️</button>`;
        }

        const msgElement = `
            <div id="msg-${data.id || ''}" class="msg-box ${msgClass}">
                <span class="username">${data.username}</span>
                <div class="msg-row">
                    ${deleteBtnHtml}
                    <div class="text">${displayContent}</div>
                    <span class="timestamp">${data.time}</span>
                </div>
            </div>`;

        msgDiv.insertAdjacentHTML('beforeend', msgElement);
        msgDiv.scrollTop = msgDiv.scrollHeight;
    });

    // 🆕 サーバーから「削除命令」が届いた時の処理
    socket.on('message_deleted_from_server', function (data) {
        const targetMsg = document.getElementById(`msg-${data.message_id}`);
        if (targetMsg) {
            // 対象のメッセージ吹き出しをシュッと画面から削除する
            targetMsg.remove();
        }
    });

    function send() {
        const input = document.getElementById('input_msg');
        if (input.value.trim() !== "") {
            socket.emit('message_from_client', {
                msg: input.value,
                room: currentRoom
            });
            input.value = '';
        }
    }

    function sendLocation() {
        if (!navigator.geolocation) {
            alert("お使いのブラウザは位置情報に対応していません。");
            return;
        }

        navigator.geolocation.getCurrentPosition(
            function(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const mapUrl = `https://www.google.com/maps?q=${lat},${lon}`;

                socket.emit('message_from_client', {
                    msg: mapUrl,
                    room: currentRoom
                });
            },
            function(error) {
                alert("位置情報の取得に失敗しました。ブラウザの位置情報許可設定を確認してください。");
            }
        );
    }

    // 🆕 ゴミ箱ボタンが押された時に、サーバーへ削除命令を飛ばす関数
    function deleteMessage(messageId) {
        if (confirm("このメッセージを削除しますか？")) {
            socket.emit('delete_message_from_client', {
                message_id: messageId,
                room: currentRoom
            });
        }
    }

    document.getElementById('input_msg').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') send();
    });

    window.onload = function() {
        const msgDiv = document.getElementById('messages');
        msgDiv.scrollTop = msgDiv.scrollHeight;
        };

        // index.html の <script> 内のどこかに追加
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js')
                .then(() => console.log('Service Worker Registered'))
                .catch((err) => console.error('Service Worker Failed', err));
        }
    </script>
</body>
</html>
