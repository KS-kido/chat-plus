<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chat - {{ room_name }}</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        :root {
            --line-blue: #7494C0;
            --line-green: #85E249;
            --header-dark: #35495e;
            --bg-gray: #f8f8f8;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* 全体のスクロールを禁止し、メッセージエリアだけを動かす */
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Kaku Gothic ProN", sans-serif;
        }

        /* アプリ全体のレイアウト */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100dvh; /* 動的ビューポート：スマホのキーボード表示に対応 */
            background-color: var(--line-blue);
        }

        /* ヘッダーデザイン */
        .header {
            background: var(--header-dark);
            color: white;
            padding: env(safe-area-inset-top) 15px 10px 15px;
            display: flex;
            align-items: center;
            min-height: 50px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 100;
        }

        .back-btn {
            text-decoration: none;
            color: white;
            font-size: 20px;
            margin-right: 15px;
        }

        /* メッセージ表示エリア */
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            -webkit-overflow-scrolling: touch;
        }

        /* 吹き出しの共通設定 */
        .msg-box {
            margin-bottom: 12px;
            max-width: 80%;
            display: flex;
            flex-direction: column;
        }

        .text {
            padding: 10px 14px;
            font-size: 16px;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
        }

            /* 【追加】吹き出しの中の位置情報リンクを見やすく装飾 */
            .text a {
                color: #0055aa;
                text-decoration: underline;
                font-weight: bold;
            }

        /* 相手のメッセージ（左側） */
        .other-msg {
            align-self: flex-start;
        }

            .other-msg .text {
                background: white;
                border-radius: 18px 18px 18px 4px;
            }

            .other-msg .username {
                font-size: 11px;
                color: white;
                margin-bottom: 3px;
                margin-left: 5px;
            }

        /* 自分のメッセージ（右側） */
        .my-msg {
            align-self: flex-end;
        }

            .my-msg .text {
                background: var(--line-green);
                border-radius: 18px 18px 4px 18px;
            }

            .my-msg .username {
                display: none; /* 自分の名前は表示しない */
            }

        /* 入力エリア */
        .input-area {
            background: white;
            padding: 10px 10px calc(10px + env(safe-area-inset-bottom)) 10px;
            display: flex;
            align-items: center;
            border-top: 1px solid #ddd;
        }

        /* 【追加】📍ボタンのデザイン */
        .geo-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 0 10px 0 5px;
            outline: none;
            transition: transform 0.1s;
        }

            .geo-btn:active {
                transform: scale(0.85); /* タップした時に少し縮む */
            }

        #input_msg {
            flex: 1;
            border: 1px solid #eee;
            background: #f0f0f0;
            padding: 10px 15px;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
        }

        .send-btn {
            color: #007aff;
            font-weight: bold;
            padding: 0 15px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <a href="/list" class="back-btn">＜</a>
            <span><b>{{ room_name }}</b></span>
        </div>

        <div id="messages">
            {% for msg in history %}
            <div class="msg-box {{ 'my-msg' if msg.login_id == session['login_id'] else 'other-msg' }}">
                <span class="username">{{ msg.user.display_name }}</span>
                <div class="text">
                    {% if msg.content.startswith('https://www.google.com/maps') %}
                    <a href="{{ msg.content }}" target="_blank">📍 現在地を共有しました</a>
                    {% else %}
                    {{ msg.content }}
                    {% endif %}
                </div>
            </div>
            {% endfor %}
        </div>
        <div class="input-area">
            <button class="geo-btn" onclick="sendLocation()">📍</button>

            <input type="text" id="input_msg" placeholder="メッセージ" autocomplete="off">
            <button class="send-btn" onclick="send()">送信</button>
        </div>
    </div>

    <script>
    const socket = io();
    const currentRoom = "{{ room_name }}";
    // 重要：現在ログインしている自分のIDをJS変数に保持
    const myLoginId = "{{ session['login_id'] }}";

    socket.on('connect', () => {
        socket.emit('join', { room: currentRoom });
    });

    // サーバーから新しいメッセージが届いた時の処理
    socket.on('message_from_server', function (data) {
        const msgDiv = document.getElementById('messages');

        // 【重要】届いたデータの login_id と 自分のID を比較して左右を決定
        const isMyMsg = (data.login_id === myLoginId);
        const msgClass = isMyMsg ? 'my-msg' : 'other-msg';

        // 【追加】新しくメッセージを受信した時、マップURLならリンクに化けさせる
        let displayContent = data.msg;
        if (data.msg.startsWith('https://www.google.com/maps')) {
            displayContent = `<a href="${data.msg}" target="_blank">📍 現在地を共有しました</a>`;
        }

        // 吹き出しのHTMLを組み立て（Jinja2のループ内と同じ構造にする）
        const msgElement = `
            <div class="msg-box ${msgClass}">
                <span class="username">${data.username}</span>
                <div class="text">${displayContent}</div>
            </div>`;

        // エリアの最後に追加
        msgDiv.insertAdjacentHTML('beforeend', msgElement);

        // 送信・受信時に自動で一番下までスクロール
        msgDiv.scrollTop = msgDiv.scrollHeight;
    });

    // 送信ボタン・Enterキーで呼ばれる関数
    function send() {
        const input = document.getElementById('input_msg');
        if (input.value.trim() !== "") {
            socket.emit('message_from_client', {
                msg: input.value,
                room: currentRoom
            });
            input.value = '';
        }
    }

    // 【追加】📍ボタンを押したときに作動する位置情報取得関数
    function sendLocation() {
        if (!navigator.geolocation) {
            alert("お使いのブラウザは位置情報に対応していません。");
            return;
        }

        navigator.geolocation.getCurrentPosition(
            function(position) {
                const lat = position.coords.latitude;  // 緯度
                const lon = position.coords.longitude; // 経度

                // 【重要・修正】タイポを完全に修正した、最も標準的なGoogleマップのURL形式
                const mapUrl = `https://www.google.com/maps?q=${lat},${lon}`;

                // 通常のメッセージと同じようにSocket.IOで送信
                socket.emit('message_from_client', {
                    msg: mapUrl,
                    room: currentRoom
                });
            },
            function(error) {
                alert("位置情報の取得に失敗しました。ブラウザの位置情報許可設定を確認してください。");
            }
        );
    }
    
    // Enterキーでも送信できるように設定
    document.getElementById('input_msg').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') send();
    });

    // 画面を開いた瞬間に一番下（最新メッセージ）を表示
    window.onload = function() {
        const msgDiv = document.getElementById('messages');
        msgDiv.scrollTop = msgDiv.scrollHeight;
    };
    </script>
</body>
</html>
