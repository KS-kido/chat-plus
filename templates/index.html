<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chat - {{ room_name }}</title>

    <link rel="manifest" href="/static/manifest.json" crossorigin="use-credentials">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>
        /* 🎨 カラーパレットや定数を定義（LINE風の配色） */
        :root {
            --line-blue: #7494C0; /* 背景の青 */
            --line-green: #85E249; /* 自分の吹き出しの緑 */
            --header-dark: #35495e; /* ヘッダーの濃いグレー */
            --bg-gray: #f8f8f8;
        }

        /* 📱 画面全体の初期化（スマホ特有の不要なスクロールを徹底的に防ぐ） */
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh; /* 確実に画面に収める */
            height: -webkit-fill-available; /* スマホブラウザ特有の高さ計算バグを強力に補正 */
            width: 100%;
            overflow: hidden; /* 画面全体は固定し、メッセージエリアだけをスクロールさせる */
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Kaku Gothic ProN", sans-serif;
        }

        /* 📦 アプリ全体のコンテナ（縦並びのレイアウト） */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: -webkit-fill-available; /* 最外枠の高さをスマホのリアルな表示領域に固定 */
            background-color: var(--line-blue);
            position: relative;
        }

        /* 🏷️ 上部ヘッダー（部屋名や戻るボタン） */
        .header {
            background: var(--header-dark);
            color: white;
            /* env(safe-area-inset-top)で、iPhoneのノッチ（前髪）を避ける余白を自動計算 */
            padding: env(safe-area-inset-top) 15px 10px 15px;
            display: flex;
            align-items: center;
            min-height: 50px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 100;
            flex-shrink: 0; /* ヘッダーが潰れるのを防ぐ */
        }

        /* ↩️ 戻るボタン（＜） */
        .back-btn {
            text-decoration: none;
            color: white;
            font-size: 20px;
            margin-right: 15px;
        }

        /* 💬 メッセージ表示エリア（ここだけがスクロールする） */
        #messages {
            flex: 1; /* 残りの画面の高さをすべて使い切る */
            overflow-y: auto; /* 縦スクロールを許可 */
            padding: 15px;
            display: flex;
            flex-direction: column;
            -webkit-overflow-scrolling: touch; /* iOSでのスクロールをなめらかにする */
        }

        /* 📦 吹き出しの外枠（共通） */
        .msg-box {
            margin-bottom: 12px;
            max-width: 85%; /* タイムスタンプが横に並ぶスペースを確保 */
            display: flex;
            flex-direction: column;
        }

        /* 🔗 吹き出しと時間・ゴミ箱を横並びにするためのコンテナ */
        .msg-row {
            display: flex;
            align-items: flex-end; /* 下揃えにすることで、LINEのように時間の文字が吹き出しの底辺に並ぶ */
        }

        /* 📝 メッセージのテキスト部分 */
        .text {
            padding: 10px 14px;
            font-size: 16px;
            line-height: 1.4;
            word-wrap: break-word; /* 長い英数字が来ても自動で改行する */
            position: relative;
        }

            /* 📍 吹き出しの中の位置情報リンクの装飾 */
            .text a {
                color: #0055aa;
                text-decoration: underline;
                font-weight: bold;
            }

        /* 🕒 タイムスタンプのデザイン（XX:XX） */
        .timestamp {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.8); /* 背景の青に馴染む白っぽい色 */
            margin: 0 5px; /* 吹き出しとの隙間 */
            white-space: nowrap; /* 時間が途中で改行されるのを防ぐ */
        }

        /* 👤 相手のメッセージ（左側配置） */
        .other-msg {
            align-self: flex-start;
        }

            /* 相手の時は [吹き出し] [時間] の順番（通常の左から右） */
            .other-msg .msg-row {
                flex-direction: row;
            }

            /* 相手の時間の文字色は、白背景で見えやすいように少し暗めのグレーに */
            .other-msg .timestamp {
                color: #666666;
            }

            .other-msg .text {
                background: white;
                border-radius: 18px 18px 18px 4px; /* 左下だけ角を尖らせる */
            }

            .other-msg .username {
                font-size: 11px;
                color: white;
                margin-bottom: 3px;
                margin-left: 5px;
            }

        /* 🧒 自分のメッセージ（右側配置） */
        .my-msg {
            align-self: flex-end;
        }

            /* 自分の時は [時間] [吹き出し] の順番にするためにリバース（逆転）させる */
            .my-msg .msg-row {
                flex-direction: row-reverse;
            }

            .my-msg .text {
                background: var(--line-green);
                border-radius: 18px 18px 4px 18px; /* 右下だけ角を尖らせる */
            }

            .my-msg .username {
                display: none; /* 自分の名前はわざわざ表示しない */
            }

        /* ⌨️ 下部の入力エリア全体 */
        .input-area {
            background: white;
            padding: 10px 10px calc(10px + env(safe-area-inset-bottom)) 10px;
            display: flex;
            align-items: center;
            border-top: 1px solid #ddd;
            flex-shrink: 0; /* 上の要素に押し出されて画面外に潰れるのを絶対に防ぐ */
            z-index: 110;
        }

        /* 📍 位置情報ボタン */
        .geo-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 0 10px 0 5px;
            outline: none;
            transition: transform 0.1s;
            flex-shrink: 0;
        }
            /* ボタンを押した時にちょっと小さくして「ポチッ」とした感覚を出す */
            .geo-btn:active {
                transform: scale(0.85);
            }

        /* ✏️ 文字の入力欄 */
        #input_msg {
            flex: 1;
            border: 1px solid #eee;
            background: #f0f0f0;
            padding: 10px 15px;
            border-radius: 25px; /* 丸っこい入力欄 */
            font-size: 16px;
            outline: none;
        }

        /* 🚀 送信ボタン */
        .send-btn {
            color: #007aff;
            font-weight: bold;
            padding: 0 15px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 16px;
            flex-shrink: 0;
        }

        /* 🗑️ メッセージ削除（ゴミ箱）ボタン */
        .delete-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 0 5px;
            opacity: 0.5; /* 普段は薄っすら表示 */
            outline: none;
            flex-shrink: 0;
        }
            /* ゴミ箱にマウスを乗せたら（またはタップしたら）クッキリ表示 */
            .delete-btn:hover {
                opacity: 1;
            }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <a href="/list" class="back-btn">＜</a>
            <span><b>{{ room_name }}</b></span>
        </div>

        <div id="messages">
            {% for msg in history %}
            <div id="msg-{{ msg.id }}" class="msg-box {{ 'my-msg' if msg.login_id == session['login_id'] else 'other-msg' }}">
                <span class="username">{{ msg.user.display_name }}</span>

                <div class="msg-row">
                    {% if msg.login_id == session['login_id'] %}
                    <button class="delete-btn" onclick="deleteMessage('{{ msg.id }}')">🗑️</button>
                    {% endif %}

                    <div class="text">
                        {% if msg.content.startswith('https://www.google.com/maps') %}
                        <a href="{{ msg.content }}" target="_blank">📍 現在地を共有しました</a>
                        {% else %}
                        {{ msg.content }}
                        {% endif %}
                    </div>
                    <span class="timestamp">{{ msg.created_at.strftime('%H:%M') }}</span>
                </div>
            </div>
            {% endfor %}
        </div>

        <div class="input-area">
            <button class="geo-btn" onclick="sendLocation()">📍</button>
            <input type="text" id="input_msg" placeholder="メッセージ" autocomplete="off">
            <button class="send-btn" onclick="send()">送信</button>
        </div>
    </div>

    <script>
    const socket = io(); // Socket.IOサーバーへの接続を開始
    const currentRoom = "{{ room_name }}"; // 現在のチャットルーム名
    const myLoginId = "{{ session['login_id'] }}"; // ログインしている自分のID

    // 🔄 サーバーに接続が成功したら、すぐにこのチャットルーム（部屋）に入る（Joinする）
    socket.on('connect', () => {
        socket.emit('join', { room: currentRoom });
    });

    // 📡 サーバーから「新しいメッセージ」が送られてきた時のリアルタイム受信処理
    socket.on('message_from_server', function (data) {
        const msgDiv = document.getElementById('messages');

        const isMyMsg = (data.login_id === myLoginId);
        const msgClass = isMyMsg ? 'my-msg' : 'other-msg';

        let displayContent = data.msg;

        // 🛠️ Google公式URLまたはマップURLの判定（過去のパターンを網羅してリンク化）
        if (data.msg.startsWith('https://www.google.com/maps') ||
            data.msg.includes('http://googleusercontent.com/maps.google.com/')) {
            displayContent = `<a href="${data.msg}" target="_blank" class="map-link">📍 現在地を共有しました</a>`;
        }

        let deleteBtnHtml = '';
        if (isMyMsg && data.id) {
            deleteBtnHtml = `<button class="delete-btn" onclick="deleteMessage('${data.id}')">🗑️</button>`;
        }

        const msgElement = `
            <div id="msg-${data.id || ''}" class="msg-box ${msgClass}">
                <span class="username">${data.username}</span>
                <div class="msg-row">
                    ${deleteBtnHtml}
                    <div class="text">${displayContent}</div>
                    <span class="timestamp">${data.time}</span>
                </div>
            </div>`;

        msgDiv.insertAdjacentHTML('beforeend', msgElement);
        msgDiv.scrollTop = msgDiv.scrollHeight;
    });

    // 📡 サーバーから「メッセージが削除されたよ」という通知が届いた時の処理
    socket.on('message_deleted_from_server', function (data) {
        const targetMsg = document.getElementById(`msg-${data.message_id}`);
        if (targetMsg) {
            targetMsg.remove();
        }
    });

    // 📝 メッセージを送信する関数
    function send() {
        const input = document.getElementById('input_msg');
        if (input.value.trim() !== "") {
            socket.emit('message_from_client', {
                msg: input.value,
                room: currentRoom
            });
            input.value = '';
        }
    }

    // 📍 位置情報を取得して送信する関数
    function sendLocation() {
        if (!navigator.geolocation) {
            alert("お使いのブラウザは位置情報に対応していません。");
            return;
        }

        navigator.geolocation.getCurrentPosition(
            function (position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                // 💡 正しいGoogleマップのURL形式
                const mapUrl = `https://www.google.com/maps?q=${lat},${lon}`;

                socket.emit('message_from_client', {
                    msg: mapUrl,
                    room: currentRoom
                });
            },
            function (error) {
                alert("位置情報の取得に失敗しました。");
            }
        );
    }

    // 🗑️ ゴミ箱ボタンが押された時に動く関数
    function deleteMessage(messageId) {
        if (confirm("このメッセージを削除しますか？")) {
            socket.emit('delete_message_from_client', {
                message_id: messageId,
                room: currentRoom
            });
        }
    }

    // ⌨️ 入力欄でEnterキーが押されたら送信ボタンの代わりに `send()` を動かす設定
    document.getElementById('input_msg').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') send();
    });

    // 🔄 ページが初めて読み込まれた（またはリフレッシュされた）時に動く初期化処理
    window.onload = function() {
        const msgDiv = document.getElementById('messages');
        if (msgDiv) {
            msgDiv.scrollTop = msgDiv.scrollHeight;
        }
    };

    // 🛠️ サービスワーカー（PWA用アプリ化エンジン）の登録処理
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/static/sw.js', { scope: '/' })
            .then(() => console.log('Service Worker Registered from static!'))
            .catch((err) => console.error('Service Worker Failed', err));
    }
    </script>
</body>
</html>
