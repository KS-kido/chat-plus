<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ user.display_name }}のプロフィール</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }

        .card {
            background: white;
            width: 90%;
            max-width: 400px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            padding-bottom: 30px;
        }

        .bg {
            background-color: #2c3e50;
            height: 100px;
        }

        .icon {
            width: 100px;
            height: 100px;
            background: #abc;
            border-radius: 50%;
            border: 4px solid white;
            margin: -50px auto 10px;
            font-size: 40px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .name {
            font-size: 24px;
            font-weight: bold;
        }

        .id {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .bio {
            padding: 0 30px;
            color: #444;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #85E249;
            color: white;
            text-decoration: none;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="bg"></div>
        <div class="icon">{{ user.display_name[0] }}</div>
        <div class="name">{{ user.display_name }}</div>
        <div class="id">@{{ user.login_id }}</div>
        <div class="bio">{{ user.profile_text }}</div>

        {% if is_mine %}
        <a href="/logout" class="btn" style="background:#e74c3c;">ログアウト</a>
        {% else %}
        <a href="/list" class="btn">トーク一覧に戻る</a>
        {% endif %}
    </div>
</body>
</html>
