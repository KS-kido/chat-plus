<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ user.display_name }}のプロフィール</title>
    <style>
        /* 既存のスタイルはそのまま */
        body {
            font-family: sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }

        .card {
            background: white;
            width: 90%;
            max-width: 400px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            padding-bottom: 30px;
        }

        .bg {
            background-color: #2c3e50;
            height: 100px;
        }

        /* アイコン部分の調整（画像を表示しやすく） */
        .icon {
            width: 100px;
            height: 100px;
            background: #abc;
            border-radius: 50%;
            border: 4px solid white;
            margin: -50px auto 10px;
            font-size: 40px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* 画像がはみ出ないように */
        }

            .icon img {
                width: 100%;
                height: 100%;
                object-fit: cover; /* 縦横比を維持してフィット */
            }

        .name {
            font-size: 24px;
            font-weight: bold;
        }

        .id {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .bio {
            padding: 0 30px;
            color: #444;
            line-height: 1.6;
            min-height: 50px;
        }

        .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background: #85E249;
            color: white;
            text-decoration: none;
            border-radius: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="bg"></div>

        <!-- アイコン部分の修正 -->
        <div class="icon">
            {% if user.profile_image and user.profile_image != 'default.png' %}
            <img src="{{ url_for('static', filename='profile_pics/' + user.profile_image) }}" alt="icon">
            {% else %}
            {{ user.display_name[0] }}
            {% endif %}
        </div>

        <div class="name">{{ user.display_name }}</div>
        <div class="id">@{{ user.login_id }}</div>
        <div class="bio">{{ user.profile_text }}</div>

        <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
            {% if is_mine %}
            <!-- 自分の時だけ「編集」ボタンを出す -->
            <a href="{{ url_for('edit_profile') }}" class="btn">プロフィールを編集</a>
            <a href="/logout" class="btn" style="background:#e74c3c;">ログアウト</a>
            <a href="/list" class="btn">トーク一覧に戻る</a>
            {% else %}
            <a href="/list" class="btn">トーク一覧に戻る</a>
            {% endif %}
        </div>
    </div>
</body>
</html>
